<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Addis Market interactive shopping list"
    >

    <title>Addis Market | Shopping List</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Addis Market</h1>

        <p>
            Create your shopping list and track your total ETB cost.
        </p>
    </header>

    <main>

        <section id="shopping-section">

            <h2>My Shopping List</h2>

            <form id="add-form">

                <div>
                    <label for="name">Item Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="e.g. Coffee"
                        required
                    >
                </div>

                <div>
                    <label for="price">Price (ETB)</label>

                    <input
                        type="number"
                        id="price"
                        name="price"
                        min="1"
                        step="0.01"
                        placeholder="e.g. 250"
                        required
                    >
                </div>

                <button type="submit">
                    Add Item
                </button>

            </form>

            <h2>Items</h2>

            <ul id="list"></ul>

            <h2>
                Total:
                <span id="total">0.00 ETB</span>
            </h2>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Addis Market</p>
    </footer>

    <script src="app.js"></script>

</body>

</html>
