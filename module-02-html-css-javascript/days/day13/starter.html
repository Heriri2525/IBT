<!DOCTYPE html>
<html lang="en">
<head>

    <title>Habesha Eatery Menu</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main>
        <article class="menu-card">

            <h1 class="menu-card__name">
                Doro Wot
            </h1>

            <p class="menu-card__description">
                A traditional Ethiopian chicken stew prepared
                with berbere, onions, garlic and spices.
            </p>

            <ul class="menu-card__ingredients">
                <li>Chicken</li>
                <li>Berbere</li>
                <li>Onions</li>
                <li>Garlic</li>
                <li>Spices</li>
            </ul>

            <p class="menu-card__price">
                450
            </p>

        </article>
    </main>
