<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birr Watch</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">

        <header>
            <h1>Birr Watch</h1>
            <p>Live Ethiopian Birr exchange-rate tracker</p>
        </header>

        <!-- Status -->
        <p id="status" class="status">Loading rates...</p>

        <!-- Converter -->
        <section class="card">
            <h2>Currency Converter</h2>

            <form id="convert-form">

                <div class="form-group">
                    <label for="amount">Amount in ETB</label>
                    <input
                        id="amount"
                        type="number"
                        min="0"
                        step="0.01"
                        value="100"
                        placeholder="Enter amount"
                    >
                </div>

                <div class="form-group">
                    <label for="currency">Currency</label>
                    <select id="currency">
                        <option>Loading...</option>
                    </select>
                </div>

                <div class="buttons">
                    <button type="submit">Convert</button>
                    <button type="button" id="watch">Add to Watchlist</button>
                </div>

            </form>

            <p id="result" class="result"></p>
        </section>

        <!-- Watchlist -->
        <section class="card">
            <h2>My Watchlist</h2>

            <ul id="watchlist">
                <li>No currencies yet</li>
            </ul>
        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
